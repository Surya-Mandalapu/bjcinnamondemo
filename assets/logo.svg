  <path d="M 30 42 C 14 42 14 66 30 66 C 18 66 18 42 30 42 Z" fill="#822920" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Coffee Cup Body -->
  <path d="M 28 36 C 28 62 34 74 50 74 C 66 74 72 62 72 36 Z" fill="#822920" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>

